name: CAS Test Pipeline

on:
  push:
    branches:
      - main
      - feat/frontend-playbook-v2
  pull_request:
    branches:
      - main
      - feat/frontend-playbook-v2

jobs:
  test:
    name: Lint & Runtime Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Runtime tests run via native `node --test *.ts` (type stripping),
        # which requires Node >= 22.6. Node 20 cannot execute .ts directly.
        node: ["22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        # No package-lock.json in this repo — use npm install (not npm ci).
        run: npm install

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: Run runtime tests (node --test)
        run: npm run test:runtime
