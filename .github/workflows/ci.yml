name: CI

on:
  push:
    branches: [main, master, "claude/**", "feature/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm` here: that option requires a package-lock.json /
      # npm-shrinkwrap.json / yarn.lock, and this repository tracks bun.lock
      # only. Enabling it fails the job with "Dependencies lock file is not
      # found".
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # `npm ci` cannot be used here for the same reason.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check (tsc --noEmit)
        run: npm run lint

      # engines + rules (derivation, registry, emitter) + registry lint (provenance, dead rules, every context
      # emits) + docs lint (docs may not duplicate thresholds or state test counts)
      - name: Engine, rules and docs tests, registry lint
        run: npm test

      - name: Build
        run: npm run build

      - name: Sheet generation is deterministic (two emissions of every valid context are byte-identical)
        run: |
          node scripts/emit-sheet.mjs --all --out-dir "$RUNNER_TEMP/sheets-a"
          node scripts/emit-sheet.mjs --all --out-dir "$RUNNER_TEMP/sheets-b"
          diff -r "$RUNNER_TEMP/sheets-a" "$RUNNER_TEMP/sheets-b"

  # The AestheticConstraintSheet contract is owned by design-compiler. This job checks out the compiler at the
  # ref this skill pins (contract/dc-contract.pin.json) and requires every sheet this checkout emits to pass
  # the compiler's JSON Schema and semantic validation (hashes, provenance, capabilities, confidence fuse,
  # band consistency, contract identity).
  contract-conformance:
    name: contract conformance (design-compiler @ pinned ref)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the compiler pin
        id: pin
        run: |
          echo "repo=$(node -p "require('./contract/dc-contract.pin.json').repository")" >> "$GITHUB_OUTPUT"
          echo "ref=$(node -p "require('./contract/dc-contract.pin.json').ref")" >> "$GITHUB_OUTPUT"

      - name: Check out design-compiler at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: .cross-repo/design-compiler

      - name: Install design-compiler
        working-directory: .cross-repo/design-compiler
        run: npm ci --no-audit --no-fund

      - name: Every emitted sheet passes the compiler's schema and semantic validation
        working-directory: .cross-repo/design-compiler
        run: npx ts-node --project tsconfig.test.json scripts/binding/verify-binding.ts --no-pin --skill "$GITHUB_WORKSPACE"

  # Real cross-repo end-to-end: the compiler's own chain tests consume the sheets THIS checkout emits
  # (skill -> sheet -> RawDesignIR -> RFC 6902 patches -> ValidatedDesignIR -> ExecutionPlan -> scene compilation),
  # plus the adversarial matrix and the rollback suite. SKILL_BINDING_STRICT refuses sheets from a dirty checkout.
  cross-repo-e2e:
    name: cross-repo E2E (compiler chain on this skill's output)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the compiler pin
        id: pin
        run: |
          echo "repo=$(node -p "require('./contract/dc-contract.pin.json').repository")" >> "$GITHUB_OUTPUT"
          echo "ref=$(node -p "require('./contract/dc-contract.pin.json').ref")" >> "$GITHUB_OUTPUT"

      - name: Check out design-compiler at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: .cross-repo/design-compiler

      - name: Install design-compiler
        working-directory: .cross-repo/design-compiler
        run: npm ci --no-audit --no-fund

      - name: Skill -> compiler chain, adversarial matrix, rollback
        working-directory: .cross-repo/design-compiler
        env:
          SKILL_DIR: ${{ github.workspace }}
          SKILL_BINDING_STRICT: "1"
        run: |
          # jest silently ignores a path that does not exist: make a missing suite a failure, not a skip
          SUITES="sheet-validator e2e-core-chain e2e-scene-chain requirements-coverage adversarial rollback"
          ARGS=""
          for s in $SUITES; do
            f="tests/skill-bridge/$s.test.ts"
            test -f "$f" || { echo "::error::$f does not exist at the pinned design-compiler ref"; exit 1; }
            ARGS="$ARGS $f"
          done
          npx jest $ARGS

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: npm audit
        run: npm audit --audit-level=high || true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The dependency graph must be enabled in repository settings; if it is
    # not, the action errors out. Keep that from failing the whole check.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
