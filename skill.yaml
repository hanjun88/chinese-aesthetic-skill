name: chinese-aesthetic-skill
version: 1.0.0
author: HEARTMIRROR Team
description: |
  中式美学设计 Skill。为 AI 设计工具（Impeccable/Figma/Codex/Floot/img2threejs）提供可执行的中国传统建筑与美学规则，
  约束 HEARTMIRROR Act 0 的视觉与交互实现。覆盖空间秩序、虚实关系、比例、材料、光影、色彩、动势、时间感、禁忌、交互语义
  十大核心规则，每条含可测指标、P0/P1 判定条件与实现建议。

  触发场景：设计中式/东方风格界面、3D场景、动效、交互原型时；
  评审已有设计是否符合中式美学时；为 img2threejs 生成材质参数和深度图规范时。

  不适用：纯功能性UI无美学诉求；明确要求西方/现代/极简风格；功能需求/内容故事/文案撰写。

license: MIT
repository: https://github.com/hanjun88/chinese-aesthetic-skill

# 构建期依赖：无。本 Skill 为零运行时 npm 依赖的自包含包。
# 下方为「管线集成点」——同一设计管线中的相邻 Skill，定义数据契约与调用顺序，
# 但不由本包 import/require，也不参与安装解析。详见 docs/references.md §4。
runtime_dependencies: []

# 管线集成点（非构建依赖；顺序：finesse-brief → 本Skill → finesse-skill → frame-smith → finesse-term）
integration_points:
  - name: finesse-brief
    repo: https://github.com/mouse-lin/finesse-brief
    role: 上游需求规格
    contract: 读取其 spec.md 的 aesthetic_constraints 字段
  - name: finesse-skill
    repo: https://github.com/mouse-lin/finesse-skill
    role: 下游界面设计执行
    contract: 输出 recommendations（colors/layout/materials/effects）供其应用
  - name: frame-smith
    repo: https://github.com/mouse-lin/frame-smith
    role: 下游动效执行
    contract: 读取 motion/effects 中的动势约束
  - name: finesse-term
    repo: https://github.com/mouse-lin/finesse-term
    role: 术语对齐
    contract: 本 Skill 术语（界/虚实/举折/出檐等）在其术语库可查

# 机器契约
# 本 Skill 向 design-compiler 输出 AestheticConstraintSheet：约束、阈值、出处与置信度全部来自规则登记簿 rules/。
# schema 由 design-compiler 持有（contracts/aesthetic-constraint-sheet/），本仓库只在 contract/dc-contract.pin.json
# 钉扎其版本与哈希，不保留副本。生成：node scripts/emit-sheet.mjs（--list 列出有效与被排除的设计上下文）。
contract:
  name: AestheticConstraintSheet
  owner: design-compiler
  pin: contract/dc-contract.pin.json
  emit: node scripts/emit-sheet.mjs
  registry: rules/

# 规则模块索引
rules:
  - id: spatial-order
    file: guidelines/spatial-order.md
    priority: P0
    title: 空间秩序（中轴对称、层级布局）
  - id: void-solid
    file: guidelines/void-solid.md
    priority: P0
    title: 虚实关系（留白与建筑体量）
  - id: proportion
    file: guidelines/proportion.md
    priority: P0
    title: 比例（屋宽高、柱距/间距关系）
  - id: material
    file: guidelines/material.md
    priority: P1
    title: 材料与质感（木、石、砖、金属）
  - id: light-shadow
    file: guidelines/light-shadow.md
    priority: P1
    title: 光影布局（柔和光线、层次感）
  - id: color
    file: guidelines/color.md
    priority: P0
    title: 色彩体系（五正色与衍生）
  - id: motion
    file: guidelines/motion.md
    priority: P1
    title: 运动动势（云流、粒子、摄像机运动）
  - id: time
    file: guidelines/time.md
    priority: P1
    title: 时间感（风化、昼夜变化）
  - id: taboo
    file: guidelines/taboo.md
    priority: P0
    title: 禁忌（文化符号与廉价感避免）
  - id: interaction
    file: guidelines/interaction.md
    priority: P0
    title: 交互语义（动作触发对应意象）

# 验收流程
gates:
  - id: Gate1
    name: 仓库结构与文档完整性
    type: automated
  - id: Gate2
    name: 模块文件与规则完整性
    type: automated+manual
  - id: Gate3
    name: 规则算法与示例
    type: automated
  - id: Gate4
    name: UI/动效集成验证
    type: integration
  - id: Gate5
    name: 用户验收与审美评估
    type: manual
